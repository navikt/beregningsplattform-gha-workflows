name: Build and test application

on:
  workflow_call:
    inputs:
      java-version:
        required: false
        type: string
        description: Java version to build with
        default: "25"
      project-directory:
        required: false
        type: string
        description: Root directory of the Gradle project, relative to repo root. Use for monorepos where the build is not at repo root.
        default: "."
      gradle-task:
        required: false
        type: string
        description: Gradle task to run (build and test)
        default: "./gradlew build installDist --configuration-cache"
      upload-artifact:
        required: false
        type: boolean
        default: false
        description: Upload build artifact for Docker image builds
      artifact-directory:
        required: false
        type: string
        default: ""
        description: Module directory, relative to repo root, whose build/ is uploaded. Defaults to project-directory.
      artifact-name:
        required: false
        type: string
        default: "gradle-build"
        description: Artifact name prefix. The artifact is named <artifact-name>-<run_id>. Must be unique per run when called from a matrix.

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # ratchet:step-security/harden-runner@v2.22.4
        with:
          egress-policy: audit

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Set up JDK
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # ratchet:actions/setup-java@v6.3.0
        with:
          distribution: "temurin"
          java-version: ${{ inputs.java-version }}

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # ratchet:gradle/actions/setup-gradle@v6.4.1
        with:
          cache-provider: basic

      - name: Build and test application
        working-directory: ${{ inputs.project-directory }}
        env:
          GRADLE_TASK: ${{ inputs.gradle-task }}
        run: $GRADLE_TASK

      - name: Upload build artifact
        if: ${{ inputs.upload-artifact == true }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # ratchet:actions/upload-artifact@v7.0.2
        with:
          name: ${{ inputs.artifact-name }}-${{ github.run_id }}
          path: ${{ format('{0}/build/', inputs.artifact-directory || inputs.project-directory) }}
          retention-days: 1
